[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-ai-bench"
version = "0.1.0"
description = "Reproducible local risk-reduction harness for NETWORK AI"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
network-ai-bench = "network_ai_bench.cli:main"

[tool.setuptools.packages.find]
where = ["benchmarks/python"]

