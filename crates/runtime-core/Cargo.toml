[package]
name = "network-ai-runtime"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Dev-Encrypted"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
rand = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
