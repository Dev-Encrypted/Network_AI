[package]
name = "network-ai-transport-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
libp2p = { version = "=0.57.0", default-features = false, features = ["tokio", "quic", "request-response", "cbor", "macros", "ed25519"] }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

