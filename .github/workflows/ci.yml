name: Research bench and private application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s benchmarks/tests -v
      - run: python benchmarks/scripts/verify_repository.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.93.1 fmt --all -- --check
      - run: cargo +1.93.1 test --locked
      - run: cargo +1.93.1 clippy --locked --all-targets -- -D warnings

  product:
    name: Private application and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lab:init
      - run: pnpm build
      - run: pnpm test:integration
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: cargo +1.93.1 build --locked -p network-ai-node -p network-ai-gateway
      - run: pnpm lab:start --no-build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --grep 'mobile layout|browser proxy'
      - run: node scripts/verify-backup.mjs
      - if: always()
        run: pnpm lab:stop
