name: Bancada F0

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python e documentação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s benchmarks/tests -v
      - run: python benchmarks/scripts/verify_repository.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.93.1 fmt --all -- --check
      - run: cargo +1.93.1 test --locked
      - run: cargo +1.93.1 clippy --locked --all-targets -- -D warnings
